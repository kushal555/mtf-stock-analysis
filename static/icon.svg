<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Background with Rounded Corners (iOS / Android icon style) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.5"/>

  <!-- Subtle grid lines -->
  <line x1="80" y1="180" x2="432" y2="180" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="260" x2="432" y2="260" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="80" y1="340" x2="432" y2="340" stroke="#1e293b" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Candlesticks & Bars -->
  <!-- Candle 1: Red pullback -->
  <line x1="130" y1="230" x2="130" y2="360" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <rect x="116" y="260" width="28" height="70" rx="5" fill="#f43f5e"/>

  <!-- Candle 2: Support base (Buy Zone) -->
  <line x1="210" y1="250" x2="210" y2="380" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <rect x="196" y="280" width="28" height="60" rx="5" fill="url(#emeraldGrad)"/>

  <!-- Candle 3: Breakout candle -->
  <line x1="290" y1="160" x2="290" y2="320" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <rect x="276" y="190" width="28" height="95" rx="5" fill="url(#emeraldGrad)"/>

  <!-- Candle 4: +10% Target reached -->
  <line x1="370" y1="110" x2="370" y2="240" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <rect x="356" y="130" width="28" height="80" rx="5" fill="url(#blueGrad)"/>

  <!-- Glowing Trend Line -->
  <path d="M 130 310 Q 200 320, 290 220 T 400 120" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Target Star / Dot -->
  <circle cx="400" cy="120" r="10" fill="#6ee7b7" filter="url(#glow)"/>
  <circle cx="400" cy="120" r="5" fill="#ffffff"/>

  <!-- Modern MTF Badge in Bottom Corner -->
  <rect x="146" y="410" width="220" height="44" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" opacity="0.9"/>
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle" letter-spacing="3">MTF TRADER</text>
</svg>